<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8E4DF">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>化妆师工作台</title>
<style>
/* ========== 多巴胺配色系统 ========== */
:root{
  --bg:#FFF8F0;          /* 主背景 暖奶油白 */
  --bg-2:#FFF0E6;        /* 次背景 蜜桃 */
  --card:#FFFFFF;        /* 卡片 纯白 */
  --card-2:#FFF5FA;      /* 浅卡片 樱花 */
  --ink:#2D1B4E;         /* 主文字 深紫 */
  --ink-2:#6B5B8C;       /* 次文字 */
  --ink-3:#B0A3C9;       /* 弱文字 */
  --line:#F0E6FF;        /* 分割线 淡紫 */
  --line-2:#E0D0F5;      /* 强分割线 */
  --accent:#FF5C8A;      /* 主强调 热粉 */
  --accent-2:#FF8FB1;    /* 次强调 */
  --accent-soft:#FFE0EC; /* 强调浅 */
  --income:#00C896;      /* 收入 翠绿 */
  --expense:#FF4757;     /* 支出 鲜红 */
  --warn:#FFA502;        /* 提醒 活力橙 */
  --info:#3742FA;        /* 信息 电光蓝 */
  --purple:#A55EEA;      /* 活力紫 */
  --cyan:#00D9FF;        /* 青蓝 */
  --yellow:#FFD93D;      /* 明黄 */
  --shadow:0 4px 16px rgba(255,92,138,.10);
  --shadow-2:0 8px 28px rgba(255,92,138,.16);
  --radius:16px;
  --radius-sm:10px;
  --nav-h:62px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--ink);background:none;border:none;outline:none;-webkit-appearance:none;border-radius:0;}
input::placeholder,textarea::placeholder{color:var(--ink-3);}
ul{list-style:none;}
img{max-width:100%;display:block;}

/* ========== 主框架 ========== */
.app{min-height:100vh;display:flex;}
/* 左侧固定侧边栏 - 桌面端 */
.sidebar{
  width:200px;flex-shrink:0;background:var(--card);
  border-right:1px solid var(--line);
  position:fixed;top:0;left:0;bottom:0;
  display:flex;flex-direction:column;
  z-index:50;padding-top:var(--safe-t);
  transition:transform .3s ease;
}
.sidebar-head{padding:24px 18px 16px;}
.sidebar-head .logo{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px;}
.sidebar-head .sub{font-size:11px;color:var(--ink-3);margin-top:2px;}
.nav-list{flex:1;overflow-y:auto;padding:8px 10px 80px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;border-radius:var(--radius-sm);
  color:var(--ink-2);font-size:14px;margin-bottom:2px;
  transition:all .2s;width:100%;text-align:left;
}
.nav-item:hover{background:var(--bg-2);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.nav-item .ico{width:20px;height:20px;flex-shrink:0;}
.nav-item .del{margin-left:auto;width:18px;height:18px;opacity:0;transition:opacity .2s;}
.nav-item.editing .del{opacity:.5;}
.nav-item .del:hover{opacity:1;color:var(--expense);}
.sidebar-foot{padding:12px 14px 20px;border-top:1px solid var(--line);}
.add-nav{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:14px;padding:11px 14px;width:100%;border-radius:var(--radius-sm);}
.add-nav:hover{background:var(--bg-2);color:var(--accent);}
.add-nav .ico{width:20px;height:20px;flex-shrink:0;}
.share-box{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;}
.share-label{font-size:11px;color:var(--ink-3);margin-bottom:4px;}
.share-url{font-size:11px;color:var(--accent);word-break:break-all;line-height:1.4;}

/* 主内容区 */
.main{flex:1;margin-left:200px;min-width:0;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);}
.main-inner{max-width:840px;margin:0 auto;padding:16px;}

/* 移动端顶部栏 */
.mobile-topbar{
  display:none;
  position:sticky;top:0;z-index:40;
  background:var(--bg);
  padding:calc(var(--safe-t) + 8px) 14px 8px;
  align-items:center;justify-content:space-between;
}
.mobile-topbar .menu-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;}
.mobile-topbar .menu-btn:active{background:var(--card);}
.mobile-topbar .title{font-size:16px;font-weight:600;}

/* 底部导航栏 */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(255,255,255,.88);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
  display:flex;align-items:stretch;z-index:45;
  box-shadow:0 -2px 20px rgba(255,92,138,.08);
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--ink-3);font-size:10px;transition:color .2s;
}
.tab-item.active{color:var(--accent);}
.tab-item .ico{width:22px;height:22px;}
.tab-item .label{font-size:10px;}

/* ========== 通用组件 ========== */
.page-title{font-size:22px;font-weight:800;margin-bottom:4px;letter-spacing:-.3px;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.page-desc{font-size:13px;color:var(--ink-3);margin-bottom:16px;}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.card + .card{margin-top:12px;}
.section-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.section-title .dot{width:4px;height:14px;border-radius:2px;background:var(--accent);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;transition:opacity .2s;
  box-shadow:0 3px 12px rgba(255,92,138,.25);
}
.btn:active{opacity:.8;}
.btn.ghost{background:var(--bg-2);color:var(--ink-2);}
.btn.ghost.active{background:var(--accent);color:#fff;}
.btn.sm{padding:7px 14px;font-size:13px;}
.btn.danger{background:var(--expense);}
.btn.block{width:100%;}
.btn.outline{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);}
.modal-foot{display:flex;gap:10px;padding:14px 16px calc(14px + var(--safe-b));border-top:1px solid var(--line);margin:0 -16px -14px;}
.modal-foot .btn{flex:1;min-width:0;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px;font-weight:500;}
.field input,.field textarea,.field select{
  width:100%;background:var(--card-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:11px 12px;font-size:14px;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:64px;}
/* AI OCR 识别区 */
.ai-ocr-box{background:linear-gradient(135deg,rgba(165,94,234,.06),rgba(255,92,138,.06));border:2px dashed rgba(165,94,234,.25);border-radius:var(--radius);padding:14px;}
.ai-ocr-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.ai-badge{background:linear-gradient(135deg,var(--purple),var(--accent));color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;flex-shrink:0;}
.ai-ocr-drop{cursor:pointer;border-radius:var(--radius-sm);overflow:hidden;text-align:center;padding:20px 12px;background:rgba(255,255,255,.6);transition:all .2s;}
.ai-ocr-drop:active{background:rgba(255,255,255,.9);}
.ocr-result{margin-top:10px;padding:10px;background:rgba(165,94,234,.08);border-radius:var(--radius-sm);}
.row{display:flex;gap:12px;}
.row>*{flex:1;}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;background:var(--accent-soft);color:var(--accent);font-weight:500;}
.tag.green{background:rgba(0,200,150,.15);color:var(--income);}
.tag.red{background:rgba(255,71,87,.15);color:var(--expense);}
.tag.gold{background:rgba(255,165,2,.15);color:var(--warn);}
.tag.blue{background:rgba(55,66,250,.15);color:var(--info);}
.tag.purple{background:rgba(165,94,234,.15);color:var(--purple);}

/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;border:2px solid transparent;}
.stat-card:nth-child(1){border-color:rgba(255,92,138,.2);background:linear-gradient(135deg,#fff 60%,#FFE0EC);}
.stat-card:nth-child(2){border-color:rgba(0,200,150,.2);background:linear-gradient(135deg,#fff 60%,#D4F5E9);}
.stat-card:nth-child(3){border-color:rgba(255,165,2,.2);background:linear-gradient(135deg,#fff 60%,#FFF3D4);}
.stat-card:nth-child(4){border-color:rgba(165,94,234,.2);background:linear-gradient(135deg,#fff 60%,#F0E0FF);}
.stat-card .label{font-size:12px;color:var(--ink-2);font-weight:500;}
.stat-card .num{font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-.5px;}
.stat-card .sub{font-size:11px;color:var(--ink-3);margin-top:4px;}
.stat-card .ring{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:48px;height:48px;}

/* 收件箱 */
.inbox-bar{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-top:12px;}
.inbox-bar .ico-wrap{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.inbox-bar .info{flex:1;}
.inbox-bar .info .t{font-size:14px;font-weight:600;}
.inbox-bar .info .s{font-size:12px;color:var(--ink-3);margin-top:2px;}
.inbox-bar .badge{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--expense);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;}

/* 悬浮按钮 */
.fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(255,92,138,.45);z-index:42;transition:transform .2s;
}
.fab:active{transform:scale(.9);}

/* ========== 弹窗 ========== */
.modal-mask{
  position:fixed;inset:0;background:rgba(74,69,64,.35);backdrop-filter:blur(3px);
  z-index:100;display:none;align-items:flex-end;justify-content:center;
}
.modal-mask.show{display:flex;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);width:100%;max-width:560px;
  border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;
  animation:slideUp .3s ease;padding:20px 18px calc(var(--safe-b) + 20px);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-head .t{font-size:17px;font-weight:700;}
.modal-head .x{width:30px;height:30px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:16px;}

/* ========== 列表项 ========== */
.list-item{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.list-item + .list-item{margin-top:10px;}
.list-item .top{display:flex;justify-content:space-between;align-items:flex-start;}
.list-item .name{font-size:15px;font-weight:600;}
.list-item .meta{font-size:12px;color:var(--ink-3);margin-top:3px;}
.list-item .actions{display:flex;gap:6px;margin-top:10px;}
.li-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3);}
.empty .ico{width:48px;height:48px;margin:0 auto 10px;opacity:.4;}

/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-head .ym{font-size:15px;font-weight:600;}
.cal-nav{width:30px;height:30px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:11px;color:var(--ink-3);padding:4px 0;}
.cal-day{text-align:center;font-size:13px;padding:8px 0;border-radius:8px;position:relative;min-height:36px;}
.cal-day.other{color:var(--ink-3);opacity:.4;}
.cal_day.today{font-weight:700;}
.cal-day.today{background:var(--accent-soft);color:var(--accent);font-weight:700;}
.cal-day.has-event::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent);}
.cal-day.selected{background:var(--accent);color:#fff;}
.cal-day.selected.has-event::after{background:#fff;}

/* 图表 */
.chart-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding:0 4px;min-width:300px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
.bar{width:60%;border-radius:4px 4px 0 0;transition:height .4s;min-height:2px;position:relative;}
.bar-label{font-size:10px;color:var(--ink-3);}

/* 快速录入浮层 */
.quick-sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:20px 18px calc(var(--safe-b)+20px);animation:slideUp .3s;}
.quick-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;}
.quick-opt{background:var(--bg-2);border-radius:var(--radius);padding:16px;text-align:center;}
.quick-opt .ico{width:32px;height:32px;margin:0 auto 8px;}
.quick-opt .t{font-size:13px;font-weight:600;}
.quick-opt .s{font-size:11px;color:var(--ink-3);margin-top:2px;}

/* 提示条 */
.toast{position:fixed;top:calc(var(--safe-t)+60px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 进度环 */
.ring-svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--bg-2);stroke-width:5;}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s;}

/* 复选框 */
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.chk.on{background:var(--accent);border-color:var(--accent);}
.chk.on svg{display:block;}
.chk svg{display:none;width:12px;height:12px;}

/* 选项卡 */
.tabs{display:flex;gap:6px;background:var(--bg-2);border-radius:var(--radius-sm);padding:3px;margin-bottom:14px;}
.tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:13px;color:var(--ink-2);transition:all .2s;}
.tab.active{background:var(--card);color:var(--accent);font-weight:600;box-shadow:var(--shadow);}

/* 图片网格 */
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.img-grid .img-cell{aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg-2);position:relative;}
.img-grid .img-cell img{width:100%;height:100%;object-fit:cover;}
.img-grid .add-cell{border:1.5px dashed var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--ink-3);}

/* 滚动区域 */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.scroll-x::-webkit-scrollbar{display:none;}

/* 响应式 */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:240px;box-shadow:var(--shadow-2);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .mobile-topbar{display:flex;}
  .main-inner{padding:12px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
}
@media(min-width:769px){
  .tabbar{display:none;}
  .main{padding-bottom:24px;}
  .fab{bottom:24px;}
}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:49;}
.sidebar-overlay.show{display:block;}

/* 心情/情绪模块样式 */
.mood-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.mood-chip{flex-shrink:0;width:48px;text-align:center;}
.mood-chip .face{width:40px;height:40px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 4px;border:2px solid transparent;}
.mood-chip.sel .face{border-color:var(--accent);background:var(--accent-soft);}
.mood-chip .lbl{font-size:10px;color:var(--ink-3);}

.filter-bar{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-chip{flex-shrink:0;padding:6px 14px;border-radius:20px;background:var(--bg-2);font-size:12px;color:var(--ink-2);}
.filter-chip.active{background:var(--accent);color:#fff;}

.note-preview{font-size:13px;color:var(--ink-2);background:var(--bg-2);border-radius:var(--radius-sm);padding:10px 12px;margin-top:8px;line-height:1.6;white-space:pre-wrap;}

.kpi-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.kpi{background:var(--bg-2);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--ink-2);}
.kpi b{color:var(--ink);font-size:13px;}
/* 栏目编辑模式 */
.nav-item.editing{padding-right:8px;}
.nav-item.editing .nav-del{display:flex;}

/* 预约状态下拉选择器 - 正方形底、三字一行、颜色统一 */
.status-sel{
  appearance:none;-webkit-appearance:none;
  width:auto;min-width:60px;height:28px;
  border:none;border-radius:14px;
  font-size:12px;font-weight:600;
  text-align:center;
  white-space:nowrap;
  line-height:28px;
  cursor:pointer;flex-shrink:0;
  color:#fff;
  background-image:none;
  padding:0 14px;
}
.status-sel::-ms-expand{display:none;}
.status-sel option{color:#333;font-weight:500;padding:4px;}
.status-sel.gold{background:var(--warn);}
.status-sel.green{background:var(--income);}
.status-sel.red{background:var(--expense);}
.status-sel-wrap{position:relative;flex-shrink:0;display:inline-flex;align-items:center;}
.nav-del{display:none;width:22px;height:22px;border-radius:50%;background:var(--expense);color:#fff;align-items:center;justify-content:center;margin-left:auto;flex-shrink:0;font-size:14px;}
.nav-del:active{opacity:.7;}
/* 图标选择器 */
.icon-picker{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px;}
.icon-opt{aspect-ratio:1;border-radius:10px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2);border:2px solid transparent;}
.icon-opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.icon-opt svg{width:20px;height:20px;}

/* ============================================================

const DB={
  _k:'mua_workbench_v1',
  data:null,
  init(){

    try{

  save(){

/* ============================================================
   云同步 - 按 ID 合并（双方数据都保留，互不覆盖）+ 后台轮询
   ============================================================ */
function mergeData(local, cloud){
  const out=JSON.parse(JSON.stringify(cloud||{}));
  // 所有“数据”集合都按 ID 合并、并以最后修改时间(_ts)决胜，确保任意一端的新增/编辑（含预约状态）都能同步到对端
  const cols=['bookings','transactions','inventory','gallery','inbox','makeupTypes','clients'];
  // 删除同步：两端删除过的 id 取并集，合并后把这些 id 从各集合中剔除
  const delSet=new Set([...(local&&local._deleted||[]), ...(cloud&&cloud._deleted||[])]);
  cols.forEach(k=>{
    const cm=new Map();
    (cloud&&cloud[k]||[]).forEach(it=>{ if(it&&it.id!=null) cm.set(it.id, it); });
    (local&&local[k]||[]).forEach(it=>{
      if(!it||it.id==null) return;
      const ex=cm.get(it.id);
      if(!ex){ cm.set(it.id, it); }            // 本地独有的 → 保留
      else {                                    // ID 冲突：较新的胜出（_ts 越大越新）
        const lt=it._ts||0, ct=ex._ts||0;
        if(lt>=ct){
          // 本机较新或相等：以本机为基底，但保留对端已勾选的“当日临时代办”，
          // 避免两台手机各自勾选不同待办时，后同步的一方把对方的勾选覆盖掉。
          let merged=it;
          if(k==='bookings'){
            merged=JSON.parse(JSON.stringify(it));
            const td={...(merged.todoDone||{})};
            Object.keys(ex.todoDone||{}).forEach(idx=>{ if(ex.todoDone[idx]) td[idx]=true; });
            merged.todoDone=td;
          }
          cm.set(it.id, merged);
        }
      }
    });
    out[k]=Array.from(cm.values()).filter(x=>!delSet.has(x.id));
  });
  out._deleted=Array.from(delSet);
  // 仅“界面个性化”保留本地（各设备可不同）；业务数据全部同步
  out.nav=(local&&local.nav)||(cloud&&cloud.nav);
  out.bottomNav=(local&&local.bottomNav)||(cloud&&cloud.bottomNav);
  out.studioName=(local&&local.studioName)||(cloud&&cloud.studioName);
  out.customNav=(local&&local.customNav)||(cloud&&cloud.customNav);
  out.customNavDef=(local&&local.customNavDef)||(cloud&&cloud.customNavDef);
  // 标签类取并集：两端各自新增的标签都保留
  out.galleryTags=Array.from(new Set([...(local&&local.galleryTags||[]), ...(cloud&&cloud.galleryTags||[])]));
  return out;
}
// 云端是否含有可合并的数据（有 _syncTS 或任一集合非空都算，避免“有数据却没时间戳”时被跳过而丢数据）
function cloudHasData(c){
  if(!c||typeof c!=='object') return false;
  if(c._syncTS) return true;
  return !!( (c.bookings&&c.bookings.length) || (c.transactions&&c.transactions.length)
    || (c.inventory&&c.inventory.length) || (c.gallery&&c.gallery.length) );
}
// 业务数据指纹：忽略每次都会变的 _syncTS，用于判断“数据是否真的变了”，
// 避免后台轮询每 6 秒都因 _syncTS 变化而整页重绘（会重置日历选中日期等界面状态）
const normData=d=>{ const c=JSON.parse(JSON.stringify(d||{})); delete c._syncTS; return JSON.stringify(c); };

// 云端读写抽象：本地/沙箱模式用 /api/data；GitHub Pages 模式用仓库里的 data.json 当同步后端
// 云端配置：令牌不写进源码（会被 GitHub 密钥扫描拦截，也更不安全）。
// 用户名/仓库名为公开信息可内置；令牌由用户在 App 内一次性填写，仅存于本机浏览器。
const GH = {
  enabled: false,
  token: '',
  owner: 'Sserena001210',
  repo: 'mua-workbench',
  path: 'data.json'
};
const CLOUD = {
  KEY:'mua_cloud_cfg',
  load(){
    try{
      const o=JSON.parse(localStorage.getItem(this.KEY)||'null');
      if(o&&o.token){ GH.enabled=true; GH.token=o.token; if(o.owner)GH.owner=o.owner; if(o.repo)GH.repo=o.repo; }
      else { GH.enabled=false; GH.token=''; }
    }catch(e){ GH.enabled=false; GH.token=''; }
  },
  save(o){ localStorage.setItem(this.KEY, JSON.stringify({token:o.token,owner:o.owner||GH.owner,repo:o.repo||GH.repo})); this.load(); },
  get(){ try{return JSON.parse(localStorage.getItem(this.KEY)||'null');}catch(e){return null;} }
};
// ===== 云端数据加密（AES-GCM + PBKDF2）=====
// 数据写入仓库前先加密，仓库里只存密文；密钥由用户在手机上设定的“同步口令”本地派生，绝不离开设备。
const ENC={
  _key:null,
  async deriveKey(pass){
    const enc=new TextEncoder();
    const salt=enc.encode('mua-workbench-v1');
    const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    this._key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  },
  async encrypt(obj){
    if(!this._key) throw new Error('未设置同步口令');
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const pt=new TextEncoder().encode(JSON.stringify(obj));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},this._key,pt);
    return bytesToB64(iv)+':'+bytesToB64(new Uint8Array(ct));
  },
  async decrypt(blob){
    if(!this._key) throw new Error('未设置同步口令');
    const [ivB,ctB]=String(blob).split(':');
    if(!ivB||!ctB) throw new Error('密文格式错误');
    const iv=b64ToBytes(ivB), ct=b64ToBytes(ctB);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},this._key,ct);
    return JSON.parse(new TextDecoder().decode(pt));
  }
};
function bytesToB64(bytes){let s='';const c=0x8000;for(let i=0;i<bytes.length;i+=c){s+=String.fromCharCode.apply(null,bytes.subarray(i,i+c));}return btoa(s);}
function b64ToBytes(b64){const s=atob(b64);const out=new Uint8Array(s.length);for(let i=0;i<s.length;i++)out[i]=s.charCodeAt(i);return out;}

// 同步口令：派生密钥保存在本地内存；同时记在本机 localStorage（mua_pass_cfg），
// 这样刷新/重开页面会自动派生、不再弹窗打断同步。口令绝不写入仓库或网页以外的任何地方，只在你这台手机上。
const PASS={
  KEY:'mua_pass_cfg',
  get(){ try{ return localStorage.getItem(this.KEY)||''; }catch(e){ return ''; } },
  save(p){ try{ if(p) localStorage.setItem(this.KEY,p); }catch(e){} },
  clear(){ try{ localStorage.removeItem(this.KEY); }catch(e){} }
};
let _keyPromise=null,_cloudOff=false,_lastPrompt=0,_passMismatch=false;
function ensureKey(force){
  if(!GH.enabled||_cloudOff) return Promise.resolve();
  if(ENC._key&&!force&&!_passMismatch) return Promise.resolve();
  if(_keyPromise) return _keyPromise;
  const saved=PASS.get();
  // 口令不一致时：绝不自动弹窗打断用户（否则会陷入“看不到+反复填”的死循环），
  // 只在顶部显示红色提示条；用户点“重置口令”时才会 force 弹窗并带错误说明。
  if(_passMismatch&&!force){
    if(saved){
      _keyPromise=ENC.deriveKey(saved).then(()=>{_keyPromise=null;}).catch(()=>{PASS.clear();});
      return _keyPromise;
    }
    return Promise.resolve();
  }
  // 本机已存过同步口令：刷新/重开后自动派生，静默恢复同步，不再弹窗打断用户
  if(saved&&!force){
    _keyPromise=ENC.deriveKey(saved).then(()=>{_keyPromise=null;}).catch(()=>{PASS.clear();});
    return _keyPromise;
  }
  const now=Date.now();
  if(now-_lastPrompt<60000) return Promise.resolve(); // 冷却，避免轮询时频繁弹窗
  _lastPrompt=now;
  _keyPromise=new Promise((resolve)=>{
    openPassModal((pass)=>{
      if(!pass){_keyPromise=null;_cloudOff=true;resolve();return;}
      ENC.deriveKey(pass).then(()=>{ PASS.save(pass); clearSyncError(); _passMismatch=false; _keyPromise=null; resolve(); }).catch(()=>{ _keyPromise=null; toast('口令设置失败'); resolve(); });
    }, _passMismatch?'当前同步口令与云端不一致，请输入和对方【完全相同】的口令':'');
  });
  return _keyPromise;
}
function showSyncError(msg){ const el=document.querySelector('#syncErr'); if(el){ el.textContent=msg; el.style.display='block'; } toast(msg); }
function clearSyncError(){ const el=document.querySelector('#syncErr'); if(el) el.style.display='none'; }
function openPassModal(cb,err){
  const m=document.querySelector('#modalContent');
  m.innerHTML=`<div class="modal-head"><div class="t">同步口令</div><button class="x" onclick="closePassModal()">✕</button></div>`
    +`<div style="padding:14px 16px;font-size:13px;color:var(--ink-2);line-height:1.7">`
    +(err?`<div style="color:#e23;margin-bottom:8px;font-weight:600">${esc(err)}</div>`:'')
    +`<b style="color:#d33">⚠️ 两台手机必须输入【完全相同】的同步口令</b>，否则互相解不开、看不到对方的数据。<br>`
    +`同步口令用于加密云端数据，它不是账号密码，而是你和对方约定好的一串相同文字。<br>`
    +`<span style="color:var(--ink-3)">口令只保存在你这台手机（本机），不会上传；记住后刷新无需重输。忘记口令后云端密文将无法解密，但本机数据仍在、也可导出备份。</span>`
    +`</div>`
    +`<div style="padding:0 16px 12px"><input id="passInput" type="password" placeholder="输入同步口令" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px"></div>`
    +`<div class="modal-foot"><button class="btn ghost" onclick="closePassModal()">取消</button><button class="btn" onclick="submitPass()">确定</button></div>`;
  document.querySelector('#modalMask').classList.add('show');
  const inp=document.querySelector('#passInput'); if(inp) inp.focus();

let _cloudSha=null;
async function cloudGet(){
  if(GH.enabled){
    await ensureKey();
    if(_cloudOff) throw new Error('云端已关闭');
    // cache:'no-store' 必须：GitHub Contents API 带缓存头，浏览器会缓存 GET，
    // 导致另一台设备刚写入的数据在轮询窗口内读不到（双向同步失效）
    const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`,{cache:'no-store',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH.token}});
    if(r.status===404) return null;                 // 仓库里还没有数据文件
    if(!r.ok) throw new Error('gh get '+r.status);
    const j=await r.json();
    // 仓库里只存密文，拉取后本地解密
    let data;
    try{ data=await ENC.decrypt(atob(j.content.replace(/\s/g,''))); _passMismatch=false; clearSyncError(); }
    catch(e){ ENC._key=null; _passMismatch=true; setSyncStatus('err','口令不一致'); showSyncError('同步口令与对方不一致：请在“设置 ⚙ → 重置口令”里输入和对方【完全相同】的同步口令，即可恢复互看对方数据'); throw new Error('解密失败：同步口令与云端不一致'); }
    return {sha:j.sha, data};
  }else{
    const res=await fetch('/api/data');
    if(!res.ok) throw new Error('api get '+res.status);
    return {data:await res.json()};
  }
}
async function cloudPut(data, sha, _try){
  _try=_try||0;
  if(GH.enabled){
    await ensureKey();
    if(_cloudOff) throw new Error('云端已关闭');
    const payload=await ENC.encrypt(data); // 加密后再上传，仓库只存密文
    const b64=btoa(payload);
    if(b64.length>950000){ toast('同步内容过大（客片图片太多/太大），无法上传云端，请减少图片数量'); setSyncStatus('err','内容过大'); throw new Error('payload too large'); }
    const body={message:'sync '+new Date().toISOString(), content:b64};
    if(sha) body.sha=sha;
    // 两端几乎同时推送会出现 sha 冲突(409)：重新拉取→合并→再推，最多重试 5 次，避免丢数据
    const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`,{method:'PUT',cache:'no-store',headers:{'Content-Type':'application/json','Accept':'application/vnd.github+json','Authorization':'Bearer '+GH.token},body:JSON.stringify(body)});
    if(r.status===409){
      if(_try>=5) throw new Error('gh put 409 重试超限');
      const cur=await cloudGet();
      if(cur&&cur.data){ data=mergeData(data, cur.data); }
      return cloudPut(data, cur?cur.sha:null, _try+1);
    }
    if(!r.ok) throw new Error('gh put '+r.status);
    return (await r.json()).content.sha;
  }else{
    await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    return null;
  }
}

function setSyncStatus(kind, text){

// 保存时与云端合并后写回（带简单节流，避免并发请求过多）
// 注意：不能用「if(_pushing)return」硬丢弃重叠的保存——连续操作（如先改状态再勾待办）
// 后一次 save() 的推送会被丢掉，导致待办/状态永远同步不出去。改为「脏标记」：
// 推送过程中若又来一次保存，等本次推完再补推一次，保证最新数据一定到云端。
let _pushing=false,_dirty=false;
async function syncPush(){
  if(_pushing){ _dirty=true; return; }
  _pushing=true;
  try{
    do{
      _dirty=false;
      setSyncStatus('busy','同步中…');
      try{
        const c=await cloudGet();
        if(c&&c.data&&cloudHasData(c.data)){ DB.data=mergeData(DB.data, c.data); _cloudSha=c.sha||_cloudSha; }
      }catch(e){console.warn('拉取云端失败',e); setSyncStatus('err','拉取失败');}
      try{
        DB.data._syncTS=Date.now();
        localStorage.setItem(DB._k,JSON.stringify(DB.data));
        _cloudSha=await cloudPut(DB.data,_cloudSha);
        setSyncStatus('ok');
      }catch(e){console.warn('推送云端失败',e); setSyncStatus('err', _passMismatch?'口令不一致':'推送失败');}
    }while(_dirty);
  }finally{ _pushing=false; }
}

// 后台轮询：近实时同步，无需手动刷新
let _syncTimer=null;
async function syncPoll(){
  // 编辑弹窗/快捷面板打开时不打断用户（二者都是 .modal-mask，打开时带 .show；
  // 注意不能判断 .quick-sheet 本身，该容器常驻 DOM、永远存在，会导致轮询永远 early-return）
  if(document.querySelector('.modal-mask.show')) return;
  setSyncStatus('busy','同步中…');
  try{
    const c=await cloudGet();
    if(!c||!c.data||!cloudHasData(c.data)){ setSyncStatus('ok'); return; }
    const before=normData(DB.data);
    DB.data=mergeData(DB.data, c.data);
    _cloudSha=c.sha||_cloudSha;
    DB.data._syncTS=Date.now();
    try{localStorage.setItem(DB._k,JSON.stringify(DB.data));}catch(e){}
    // 后台轮询只【拉取并合并】他人改动到本地，绝不回写云端——
    // 回写只发生在用户主动保存(DB.save)和首屏(autoSync)时，
    // 否则两台设备各自每 6 秒互推会形成 409 冲突风暴、把对方写入顶掉。
    if(normData(DB.data)!==before){
      if(currentView==='orders'&&ordersSubTab==='tx'){ const p=$('#ordersPanel'); if(p){p.innerHTML=viewTx();bindTx();} }
      else { renderMain(); }
      renderNav();renderTabbar();
    }
    setSyncStatus('ok');
  }catch(e){console.warn('轮询同步失败',e); setSyncStatus('err', _passMismatch?'口令不一致':'同步失败');}
}
function startSync(){ if(_syncTimer) return; _syncTimer=setInterval(syncPoll, 6000); }
async function manualSync(){ toast('同步中…'); await syncPoll(); toast('已同步'); }

(async function autoSync(){
  CLOUD.load();

  try{
    const c=await cloudGet();

  }catch(e){console.warn('首屏拉取失败',e); setSyncStatus('err','连接失败');}
  try{
    DB.data._syncTS=Date.now();
    localStorage.setItem(DB._k,JSON.stringify(DB.data));
    _cloudSha=await cloudPut(DB.data,_cloudSha);
    setSyncStatus('ok');
  }catch(e){console.warn('首屏推送失败',e); setSyncStatus('err','推送失败');}
  startSync();
})();
async function syncFromCloud(){
  try{
    const c=await cloudGet();
    if(c&&c.data&&cloudHasData(c.data)){
      DB.data=mergeData(DB.data, c.data);
      _cloudSha=c.sha||_cloudSha;
      DB.save();
      _cloudSha=await cloudPut(DB.data,_cloudSha);
      if(currentView==='orders'&&ordersSubTab==='tx'){ const p=$('#ordersPanel'); if(p){p.innerHTML=viewTx();bindTx();} }
      else { renderMain(); }
      renderNav();renderTabbar();
      toast('云端数据已同步');
    }
  }catch(e){toast('同步失败');}
}

function setBookingStatus(id,newStatus){
  const b=DB.data.bookings.find(x=>x.id===id);
  if(!b)return;
  const oldStatus=b.status;
  if(oldStatus===newStatus)return;
  b.status=newStatus;
  b._ts=Date.now();   // 必须刷新时间戳，否则合并时 _ts 与对端相同会被判“本机更旧”而回退状态
  // 如果改为已完成，自动记录尾款收支
  if(newStatus==='已完成'){
    const paid=DB.data.transactions.filter(t=>t.orderId===b.id&&t.type==='收入').reduce((s,t)=>s+t.amount,0);
    const remain=b.total-paid;
    if(remain>0){
      DB.data.transactions.push({id:uid(),date:todayStr(),orderId:b.id,type:'收入',amount:remain,incCat:'尾款',expCat:'',note:esc(b.client)+' '+esc(b.type)+' 尾款'});
      toast('已完成，尾款'+money(remain)+'已自动记录');
    }else{
      toast('状态：已完成');
    }
  }else{
    toast('状态：'+b.status);
  }
  save();
  // 就地刷新，不跳转
  if(currentView==='booking'){rerenderBooking();}
  else{renderMain();}
}
// 生成预约状态下拉选择器
function bookingStatusSelect(b){
  const colors={已定金:'gold',已完成:'green',已取消:'red'};
  const sel=document.createElement('select');
  sel.className='status-sel '+colors[b.status]||'';
  ['已定金','已完成','已取消'].forEach(s=>{
    const o=document.createElement('option');
    o.value=s;o.textContent=s;
    if(b.status===s)o.selected=true;
    sel.appendChild(o);
  });
  sel.onchange=function(e){
    e.stopPropagation();
    setBookingStatus(b.id,this.value);
  };
  sel.onclick=function(e){e.stopPropagation();};
  return sel;
}

function calViewHTML(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const first=new Date(y,m,1);const firstDow=first.getDay();
  const days=new Date(y,m+1,0).getDate();
  const dows=['日','一','二','三','四','五','六'];
  const ds=calSelDay||new Date().toISOString().slice(0,10);
  let cells='';
  for(let i=0;i<firstDow;i++)cells+=`<div class="cal-day other"></div>`;
  for(let i=1;i<=days;i++){
    const dd=String(i).padStart(2,'0');
    const mms=String(m+1).padStart(2,'0');
    const ds2=`${y}-${mms}-${dd}`;
    const has=DB.data.bookings.some(b=>b.date===ds2);
    const cls=(ds===ds2?' selected':'')+(ds2===new Date().toISOString().slice(0,10)?' today':'')+(has?' has-event':'');

  b.todoDone[idx]=!b.todoDone[idx];
  b._ts=Date.now();
  save();

  const chk=e?e.target.closest('.chk')||e.currentTarget:null;

/* ---- AI 图片识别 ---- */
let ocrImgData=null;
function initOCR(){
  const drop=$('#ocrDrop');
  const fileInput=$('#ocrFile');
  // 点击上传
  drop.onclick=()=>fileInput.click();
  fileInput.onchange=e=>{
    const f=e.target.files[0];
    if(f)loadOCRImage(f);
  };
  // 粘贴
  document.addEventListener('paste',onPasteOCR);
}
function onPasteOCR(e){
  if(!$('#ocrDrop'))return;
  const items=e.clipboardData.items;
  for(let item of items){
    if(item.type.startsWith('image/')){
      const f=item.getAsFile();
      if(f)loadOCRImage(f);
      e.preventDefault();
      break;
    }
  }
}
function loadOCRImage(file){
  const r=new FileReader();
  r.onload=e=>{
    ocrImgData=e.target.result;
    $('#ocrPreview').innerHTML='<img src="'+ocrImgData+'" style="width:100%;border-radius:8px;max-height:200px;object-fit:cover">';
    $('#ocrPreview').style.display='block';
    $('#ocrPlaceholder').style.display='none';
    $('#ocrBtn').style.display='flex';
  };
  r.readAsDataURL(file);
}
async function startOCR(){
  if(!ocrImgData){toast('请先上传截图');return;}
  $('#ocrBtn').style.display='none';
  $('#ocrLoading').style.display='block';
  try{
    // 动态加载 Tesseract.js
    if(!window.Tesseract){
      await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    }
    const{data}=await Tesseract.recognize(ocrImgData,'chi_sim+eng',{
      logger:m=>{if(m.status==='recognizing text'){$('#ocrLoading').innerHTML='<div style="font-size:13px;color:var(--purple);font-weight:600">⏳ 识别中 '+Math.round(m.progress*100)+'%</div>';}}
    });
    const text=data.text;
    $('#ocrLoading').style.display='none';
    $('#ocrBtn').style.display='flex';
    // 展示识别结果并自动填充
    parseOCRResult(text);
  }catch(err){
    // 降级：用云端AI视觉识别
    $('#ocrLoading').innerHTML='<div style="font-size:13px;color:var(--purple);font-weight:600">⏳ 正在调用AI视觉识别...</div>';
    try{
      const result=await aiVisionOCR(ocrImgData);
      $('#ocrLoading').style.display='none';
      $('#ocrBtn').style.display='flex';
      parseOCRResult(result);
    }catch(e2){
      $('#ocrLoading').style.display='none';
      $('#ocrBtn').style.display='flex';
      toast('识别失败，请手动填写');
    }
  }
}
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src;s.onload=res;s.onerror=rej;
    document.head.appendChild(s);
  });
}
async function aiVisionOCR(imgData){
  // 调用本地代理AI视觉识别接口
  const resp=await fetch('https://d755df89ffeefd4d-120-53-27-226.serveousercontent.com/api/ocr',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({image:imgData})
  });
  if(!resp.ok)throw new Error('AI识别失败');
  const data=await resp.json();
  return data.text||'';
}
function parseOCRResult(text){
  // 智能提取预约信息
  const orig=text;
  // 日期：X月X日 / X-X / XXXX-XX-XX
  const dateM=text.match(/(\d{1,2})月(\d{1,2})[日号]/)||text.match(/(\d{4})-(\d{1,2})-(\d{1,2})/)||text.match(/(\d{1,2})[\/.](\d{1,2})/);
  let date=todayStr();
  const now=new Date();
  if(dateM){
    if(dateM.length===4&&dateM[1].length===4){
      date=`${dateM[1]}-${String(+dateM[2]).padStart(2,'0')}-${String(+dateM[3]).padStart(2,'0')}`;
    }else{
      date=`${now.getFullYear()}-${String(+dateM[1]).padStart(2,'0')}-${String(+dateM[2]).padStart(2,'0')}`;
    }
  }
  if(/明天/.test(text)){const d=new Date(now);d.setDate(now.getDate()+1);date=d.toISOString().slice(0,10);}
  if(/后天/.test(text)){const d=new Date(now);d.setDate(now.getDate()+2);date=d.toISOString().slice(0,10);}
  // 时间：支持上下午
  const ampmM=text.match(/[上下]午\s*(\d{1,2})\s*[点时:：]?(\d{0,2})/)||text.match(/(\d{1,2})\s*[点时:：](\d{0,2})/);
  let start='09:00';
  if(ampmM){
    let h=+ampmM[1],m=(ampmM[2]&&ampmM[2].length===2)?ampmM[2]:'00';
    if(/下午/.test(text)&&h<12)h+=12;
    if(/上午/.test(text)&&h===12)h=0;
    start=`${String(h).padStart(2,'0')}:${m}`;
  }
  // 电话
  const phoneM=text.match(/1\d{10}/);
  // 客户名
  const textForName=text.replace(/\d{1,2}\s*[点时]\s*/g,'').replace(/[上下]午\s*/g,'').replace(/\d{1,2}[日号]\s*/g,'').replace(/[今明后]天\s*/g,'').replace(/\d+月\s*/g,'');
  const nameM=textForName.match(/([\u4e00-\u9fa5]{1,3}(?:小姐|女士|先生))/);
  // 妆容类型
  let type='';
  if(/新娘/.test(text))type='新娘妆';
  else if(/年会/.test(text))type='年会妆';
  else if(/约会/.test(text))type='约会妆';
  else if(/舞台/.test(text))type='舞台妆';
  else if(/写真/.test(text))type='写真妆';
  else if(/日常/.test(text))type='日常妆';
  // 地址
  const addrM=text.match(/地址[：:\s是为]*([\u4e00-\u9fa5\w\d路街号大厦小区弄栋单元室]+)/);
  // 金额
  const depositM=text.match(/定金[：:\s]*(\d+)/)||text.match(/(\d+)\s*[元块]\s*定金/);
  const totalM=text.match(/全款[：:\s]*(\d+)/)||text.match(/尾款[：:\s]*(\d+)/)||text.match(/价格[：:\s]*(\d+)/);
  // 微信号
  const wxM=text.match(/微信[：:\s]*([\w\-]+)/);

  // 自动填入
  if(dateM||/明天|后天|今天/.test(text))$('#b_date').value=date;
  if(ampmM)$('#b_start').value=start;
  if(nameM)$('#b_client').value=nameM[1];
  if(phoneM)$('#b_phone').value=phoneM[0];
  else if(wxM)$('#b_phone').value=wxM[1];
  if(type)$('#b_type').value=type;
  if(addrM)$('#b_addr').value=addrM[1];
  if(depositM)$('#b_deposit').value=depositM[1];
  if(totalM)$('#b_total').value=totalM[1];

  // 显示识别摘要
  const summary=[];
  if(nameM)summary.push('👤 '+nameM[1]);
  if(dateM||/明天|后天|今天/.test(text))summary.push('📅 '+date);
  if(ampmM)summary.push('⏰ '+start);
  if(ampmM)summary.push('⏰ '+start);
  if(type)summary.push('💄 '+type);
  if(phoneM)summary.push('📞 '+phoneM[0]);
  if(addrM)summary.push('📍 '+addrM[1].slice(0,8)+'...');
  if(depositM)summary.push('💰 定金'+depositM[1]);
  if(totalM)summary.push('💵 全款'+totalM[1]);

  if(summary.length){
    const box=document.createElement('div');
    box.className='ocr-result';
    box.innerHTML='<div style="font-size:12px;color:var(--purple);font-weight:600;margin-bottom:6px">✅ AI识别完成，已自动填入：</div><div style="display:flex;flex-wrap:wrap;gap:4px">'+summary.map(s=>`<span class="tag purple">${s}</span>`).join('')+'</div>';
    $('#ocrDrop').appendChild(box);
    toast('识别完成，已自动填入'+summary.length+'项信息');
  }else{
    toast('未识别到关键信息，请手动填写');
  }
}
function saveBooking(id){
  const todo=$('#b_todo').value.split('\n').filter(x=>x.trim());
  const data={
    date:$('#b_date').value,start:$('#b_start').value,end:$('#b_end').value,
    client:$('#b_client').value,phone:$('#b_phone').value,type:$('#b_type').value,
    addr: bookingAddrValue(),deposit:+$('#b_deposit').value||0,total:+$('#b_total').value||0,
    status:$('#b_status').value,todo
  };
  // 处理图片：保留未删除的旧图 + 新上传的图
  let imgs=[];
  if(id){
    const old=DB.data.bookings.find(x=>x.id===id);
    if(old&&old.imgs){
      imgs=old.imgs.filter((_,i)=>!window._removedBookingImgs.includes(i));
    }
  }
  const files=$('#b_files')?$('#b_files').files:[];
  if(files.length){
    let pending=files.length;
    Array.from(files).forEach(f=>{
      const r=new FileReader();
      r.onload=e=>{imgs.push(e.target.result);if(!--pending)finishSave();};
      r.readAsDataURL(f);
    });
  }else{
    finishSave();
  }
  function finishSave(){
    data.imgs=imgs;
    data._ts=Date.now();
    if(id){Object.assign(DB.data.bookings.find(x=>x.id===id),data);}
    else{data.id=uid();DB.data.bookings.push(data);}
    save();closeModal();rerenderBooking();renderMain();toast('已保存');
  }
}

function delBooking(id){
  if(!confirm('确认删除该预约？'))return;
  DB.data.bookings=DB.data.bookings.filter(x=>x.id!==id);
  (DB.data._deleted=DB.data._deleted||[]).push(id);
  save();rerenderBooking();renderMain();toast('已删除');
}

async function doAddrSearch(q){
  const box=$('#addrResults'); if(!box)return;
  box.innerHTML='<div style="font-size:12px;color:var(--ink-3)">搜索中…</div>';

function rerenderTx(){

function getFilteredTx(){
  const now=new Date();
  const ds=todayStr();
  let list=DB.data.transactions;
  if(txPeriod==='day'){
    list=list.filter(t=>t.date===ds);
  }else if(txPeriod==='week'){
    const start=new Date(now);start.setDate(now.getDate()-now.getDay());
    const startDs=start.toISOString().slice(0,10);
    list=list.filter(t=>t.date>=startDs&&t.date<=ds);
  }else if(txPeriod==='month'){
    const ms=ds.slice(0,7);
    list=list.filter(t=>t.date.slice(0,7)===ms);
  }else if(txPeriod==='year'){
    const ys=ds.slice(0,4);
    list=list.filter(t=>t.date.slice(0,4)===ys);
  }else if(txPeriod==='custom'&&txFilterStart&&txFilterEnd){
    list=list.filter(t=>t.date>=txFilterStart&&t.date<=txFilterEnd);
  }
  return list;
}

    </div>`;
}
function renderTxChart(){
  const filtered=getFilteredTx();
  let labels=[],incArr=[],expArr=[];
  if(txPeriod==='day'){
    // 按小时分布不太合理，改为显示当天收入支出
    labels=['今天'];incArr=[filtered.filter(t=>t.type==='收入').reduce((s,t)=>s+t.amount,0)];expArr=[filtered.filter(t=>t.type==='支出').reduce((s,t)=>s+t.amount,0)];
  }else if(txPeriod==='week'){
    const now=new Date();
    const start=new Date(now);start.setDate(now.getDate()-now.getDay());
    for(let i=0;i<7;i++){
      const dd=new Date(start);dd.setDate(start.getDate()+i);
      const ds=dd.toISOString().slice(0,10);
      labels.push('日一二三四五六'[dd.getDay()]);
      incArr.push(filtered.filter(t=>t.date===ds&&t.type==='收入').reduce((s,t)=>s+t.amount,0));
      expArr.push(filtered.filter(t=>t.date===ds&&t.type==='支出').reduce((s,t)=>s+t.amount,0));
    }
  }else if(txPeriod==='month'){
    // 本月按天
    const ds=todayStr();
    const ms=ds.slice(0,7);
    const days=new Date(+ds.slice(0,4),+ds.slice(5,7),0).getDate();
    for(let i=1;i<=days;i++){
      const dd=ms+'-'+String(i).padStart(2,'0');
      labels.push(i);
      incArr.push(filtered.filter(t=>t.date===dd&&t.type==='收入').reduce((s,t)=>s+t.amount,0));
      expArr.push(filtered.filter(t=>t.date===dd&&t.type==='支出').reduce((s,t)=>s+t.amount,0));
    }
  }else if(txPeriod==='year'){
    // 按月
    const ys=todayStr().slice(0,4);
    for(let i=1;i<=12;i++){
      const ms=ys+'-'+String(i).padStart(2,'0');
      labels.push(i+'月');
      incArr.push(filtered.filter(t=>t.date.slice(0,7)===ms&&t.type==='收入').reduce((s,t)=>s+t.amount,0));
      expArr.push(filtered.filter(t=>t.date.slice(0,7)===ms&&t.type==='支出').reduce((s,t)=>s+t.amount,0));
    }
  }else{
    // all 或 custom：按月聚合
    const months={};
    filtered.forEach(t=>{
      const ms=t.date.slice(0,7);
      if(!months[ms])months[ms]={inc:0,exp:0};
      if(t.type==='收入')months[ms].inc+=t.amount;else months[ms].exp+=t.amount;
    });
    const keys=Object.keys(months).sort();
    keys.forEach(k=>{labels.push(k.slice(5));incArr.push(months[k].inc);expArr.push(months[k].exp);});
    if(!labels.length){labels=['暂无'];incArr=[0];expArr=[0];}
  }
  const max=Math.max(1,...incArr,...expArr);
  const chartH=140;
  let bars=labels.map((l,i)=>{
    const ih=Math.max(2,incArr[i]/max*chartH);
    const eh=Math.max(2,expArr[i]/max*chartH);
    return `<div class="bar-col">
      <div style="display:flex;gap:2px;align-items:flex-end;height:${chartH+4}px">
        <div class="bar" style="height:${ih}px;background:var(--income);min-width:8px" title="收入${money(incArr[i])}"></div>
        <div class="bar" style="height:${eh}px;background:var(--expense);min-width:8px" title="支出${money(expArr[i])}"></div>
      </div>
      <div class="bar-label">${l}</div>
    </div>`;
  }).join('');
  const totInc=incArr.reduce((a,b)=>a+b,0),totExp=expArr.reduce((a,b)=>a+b,0);
  const periodLabel=txPeriod==='day'?'今天':txPeriod==='week'?'本周':txPeriod==='month'?'本月':txPeriod==='year'?'本年':txPeriod==='custom'?'自定义区间':'全部';
  $('#txChart').innerHTML=`
    <div class="card" style="margin-top:12px">
      <div class="section-title"><span class="dot"></span>${periodLabel}收支趋势</div>
      <div style="display:flex;gap:12px;margin-bottom:8px;font-size:12px;flex-wrap:wrap">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--income);margin-right:4px"></span>收入 ${money(totInc)}</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--expense);margin-right:4px"></span>支出 ${money(totExp)}</span>
        <span style="margin-left:auto;color:var(--accent);font-weight:700">净利 ${money(totInc-totExp)}</span>
      </div>
      <div class="chart-wrap"><div class="bar-chart" style="min-width:${labels.length>10?labels.length*30:300}px">${bars}</div></div>
    </div>`;
}

/* 收支日历视图 */
function renderTxCalendar(){
  if(!txCalSel) txCalSel=todayStr();
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const first=new Date(y,m,1);const firstDow=first.getDay();
  const days=new Date(y,m+1,0).getDate();
  const dows=['日','一','二','三','四','五','六'];
  const ds=new Date().toISOString().slice(0,10);
  let cells='';
  for(let i=0;i<firstDow;i++)cells+=`<div class="cal-day other"></div>`;
  for(let i=1;i<=days;i++){
    const dd=String(i).padStart(2,'0');
    const mms=String(m+1).padStart(2,'0');
    const ds2=`${y}-${mms}-${dd}`;
    const has=DB.data.transactions.some(t=>t.date===ds2);
    const cls=(ds===ds2?' today':'')+(has?' has-event':'')+(txCalSel===ds2?' selected':'');
    cells+=`<div class="cal-day${cls}" data-day="${ds2}" onclick="txCalSel='${ds2}';renderTxDayFlow()">${i}</div>`;
  }
  $('#txCalendarView').innerHTML=`
  <div class="card" style="margin-top:12px">
    <div class="cal-head">
      <button class="cal-nav" onclick="calDate.setMonth(calDate.getMonth()-1);rerenderTx()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="ym">${y}年${m+1}月</div>
      <button class="cal-nav" onclick="calDate.setMonth(calDate.getMonth()+1);rerenderTx()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
  </div>
  <div id="txDayFlow"></div>`;
  renderTxDayFlow();
}
// 日历视图下：根据选中日渲染“当日流水”（日历保持可见）

// 库存列表（含：低库存置顶 + 按名称实时搜索过滤）
function invListHTML(){
  const all=DB.data.inventory;
  const kw=(invSearch||'').trim().toLowerCase();
  let list=all.filter(i=>!kw || (i.name||'').toLowerCase().includes(kw) || (i.shade||'').toLowerCase().includes(kw));
  // 低库存（库存≤阈值）始终置顶
  list=list.slice().sort((a,b)=>{
    const la=a.stock<=a.threshold?0:1, lb=b.stock<=b.threshold?0:1;
    if(la!==lb) return la-lb;
    return 0;
  });
  if(!list.length) return '<div class="empty">暂无物料</div>';
  return list.map(i=>{
    const exp=new Date(i.expire);const days=(exp-new Date())/86400000;
    const expTag=days<0?'tag red':days<60?'tag gold':'tag green';
    const expText=days<0?'已过期':days<60?Math.ceil(days)+'天后过期':'正常';
    const stkColor=i.stock<=i.threshold?'var(--expense)':i.stock<=i.threshold*2?'var(--warn)':'var(--income)';
    const pin=i.stock<=i.threshold?'<span style="font-size:11px;color:var(--expense);margin-left:6px">⚠ 库存不足</span>':'';
    return `<div class="list-item" id="inv_${i.id}">
      <div class="top">
        <div>
          <div class="name">${esc(i.name)} <span style="font-size:12px;color:var(--ink-3);font-weight:400">${esc(i.shade)}</span>${pin}</div>
          <div class="meta">购入 ${i.buyDate} · 保质期至 ${i.expire}</div>
        </div>
        <span class="tag ${expTag}">${expText}</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
        <div style="flex:1">
          <div style="font-size:12px;color:var(--ink-3);margin-bottom:2px">库存余量</div>
          <div style="font-size:20px;font-weight:800;color:${stkColor}">${i.stock} <span style="font-size:12px;font-weight:400">${esc(i.unit)}</span></div>
        </div>
        <div style="font-size:11px;color:var(--ink-3)">预警阈值：${i.threshold}${esc(i.unit)}</div>
      </div>
      <div class="actions">
        <button class="btn ghost sm" onclick="openInvModal(${i.id})">编辑</button>
        <button class="btn ghost sm" onclick="consumeInv(${i.id})">消耗</button>
        <button class="btn danger sm" onclick="delInv(${i.id})">删除</button>
      </div>
    </div>`;
  }).join('');
}

// 上传前压缩图片：缩放到最长边 <=1200px 并以 JPEG 0.8 导出。
// 否则手机原图 base64 动辄数 MB，会把 data.json 顶过 GitHub Contents API 的 1MB 上限，
// 导致整次同步推送失败——这正是“客片作品无法同步”的根因（纯文字的预约不受影响）。
function compressImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1, maxDim/Math.max(img.width||maxDim, img.height||maxDim));
      const cw=Math.max(1,Math.round((img.width||maxDim)*scale)), ch=Math.max(1,Math.round((img.height||maxDim)*scale));
      const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
      cv.getContext('2d').drawImage(img,0,0,cw,ch);
      URL.revokeObjectURL(url);
      try{ resolve(cv.toDataURL('image/jpeg', quality)); }catch(e){ reject(e); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
    img.src=url;
  });
}
function saveGallery(id){
  let tags=window._gallerySelTags||[];
  // 未选标签时默认归入"未分类"
  if(tags.length===0)tags=['未分类'];
  let imgs=[];
  if(id){
    const old=DB.data.gallery.find(x=>x.id===id);
    if(old&&old.imgs){
      imgs=old.imgs.filter((_,i)=>!window._removedImgs.includes(i));
    }
  }
  const files=Array.from($('#g_files').files||[]);
  let pending=files.length;
  const data={orderId:+$('#g_order').value||'',makeup:$('#g_makeup').value,imgs,tags};
  if(!pending){
    finishSave();
  }else{
    files.forEach(f=>{
      compressImage(f,1200,0.8).then(d=>{imgs.push(d);if(!--pending)finishSave();})
        .catch(()=>{toast('有一张图片处理失败，已跳过');if(!--pending)finishSave();});
    });
  }
  function finishSave(){
    data.imgs=imgs;
    data._ts=Date.now();
    if(id){Object.assign(DB.data.gallery.find(x=>x.id===id),data);}
    else{data.id=uid();DB.data.gallery.push(data);}
    save();closeModal();renderMain();toast('已保存');
  }
}

function quickParse(){
  const text=$('#quickText').value.trim();
  if(!text){toast('请输入内容');return;}
  // 智能识别
  const dateMatch=text.match(/(\d{1,2})月(\d{1,2})[日号]/);
  const timeMatch=text.match(/(\d{1,2})[点时:：](\d{0,2})/);
  const phoneMatch=text.match(/1\d{10}/);
  // 定金/全款金额：匹配"定金/全款xxx"或"定金xxx元"
  const depositMatch=text.match(/定金\s*(\d+)/)||text.match(/(\d+)\s*[元块]\s*定金/);
  const totalMatch=text.match(/全款\s*(\d+)/)||text.match(/尾款\s*(\d+)/);
  // 一般金额（不含时间数字）
  const amountMatch=text.match(/(\d+)\s*[元块]/);
  
  const now=new Date();
  let date=todayStr();
  if(dateMatch){
    date=`${now.getFullYear()}-${String(+dateMatch[1]).padStart(2,'0')}-${String(+dateMatch[2]).padStart(2,'0')}`;
  }else{
    if(/明天/.test(text)){const d=new Date(now);d.setDate(now.getDate()+1);date=d.toISOString().slice(0,10);}
    else if(/后天/.test(text)){const d=new Date(now);d.setDate(now.getDate()+2);date=d.toISOString().slice(0,10);}
    else if(/今天/.test(text)){date=todayStr();}
  }
  const start=timeMatch?`${String(+timeMatch[1]).padStart(2,'0')}:${timeMatch[2]&&timeMatch[2].length===2?timeMatch[2]:'00'}`:'09:00';
  
  // 识别妆容类型
  let type='日常妆';
  if(/新娘/.test(text))type='新娘妆';
  else if(/年会/.test(text))type='年会妆';
  else if(/约会/.test(text))type='约会妆';
  else if(/舞台/.test(text))type='舞台妆';
  else if(/写真/.test(text))type='写真妆';
  
  // 客户名：匹配"xx小姐/女士"，先去掉时间/日期干扰词
  const textForName=text.replace(/\d{1,2}\s*[点时]\s*/g,'').replace(/[上下]午\s*/g,'').replace(/\d{1,2}[日号]\s*/g,'').replace(/[今明后]天\s*/g,'').replace(/\d+月\s*/g,'');
  const name=textForName.match(/([\u4e00-\u9fa5]{1,3}(?:小姐|女士))/);
  
  closeQuick();
  openBookingModal();
  setTimeout(()=>{
    $('#b_date').value=date;
    $('#b_start').value=start;
    if(name)$('#b_client').value=name[1];
    if(phoneMatch)$('#b_phone').value=phoneMatch[0];
    $('#b_type').value=type;
    // 地址
    const addrMatch=text.match(/地址[是为：:\s]*([\u4e00-\u9fa5\w\d路街号大厦小区]+)/);
    if(addrMatch)$('#b_addr').value=addrMatch[1];
    // 定金
    if(depositMatch)$('#b_deposit').value=depositMatch[1];
    else if(amountMatch)$('#b_deposit').value=amountMatch[1];
    // 全款
    if(totalMatch)$('#b_total').value=totalMatch[1];
  },50);
}

function openModal(html){
  $('#modalContent').innerHTML=html;
  $('#modalMask').classList.add('show');
}
function closeModal(){
  $('#modalMask').classList.remove('show');
  document.removeEventListener('paste',onPasteOCR);
  ocrImgData=null;
}
$('#modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask')closeModal();});
$('#quickMask').addEventListener('click',e=>{if(e.target.id==='quickMask')closeQuick();});

   启动
   ============================================================ */
renderNav();

// 数据备份提醒（每7天提醒一次）
(function(){
  const last=localStorage.getItem('mua_backup_remind');
  const now=Date.now();
  if(!last||now-last>7*86400000){
    localStorage.setItem('mua_backup_remind',now);
  }
})();

/* 数据导出/导入 */
function exportData(){
  const data=DB.data;
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const ds=todayStr();
  a.download='mua-backup-'+ds+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('数据已导出');
}
// 导入时按 ID 合并到本机数据：添加对方数据，不整体覆盖，保留本机原有数据与配置
function mergeImport(imp){
  const cur=DB.data;
  ['bookings','transactions','inventory','gallery','inbox'].forEach(k=>{
    const map=new Map((cur[k]||[]).filter(x=>x&&x.id!=null).map(x=>[x.id,x]));
    (imp[k]||[]).forEach(it=>{ if(it&&it.id!=null) map.set(it.id, it); });
    cur[k]=Array.from(map.values());
  });
  // 配置项（工作室名/栏目/品类等）保留本机原有，不被导入文件覆盖
  return cur;
}
function importData(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=function(){
    const file=this.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=function(e){
      try{
        const imported=JSON.parse(e.target.result);
        if(imported.bookings||imported.transactions||imported.inventory||imported.gallery||imported.inbox){
          DB.data=mergeImport(imported);
          DB.data._syncTS=Date.now();
          save();
          renderMain();renderNav();renderTabbar();
          toast('已合并导入（保留原有数据）');
        }else{toast('无效的备份文件');}
      }catch(ex){toast('文件解析失败');}
    };
    reader.readAsText(file);
  };
  document.body.appendChild(input);
  input.click();
  document.body.removeChild(input);
}
/* 当前分享链接：从后端实时读取隧道 URL */
function loadShareUrl(){
  const box=$('#shareBox'), urlEl=$('#shareUrl');
  if(!box||!urlEl)return;
  try{
    fetch('/api/url').then(r=>r.json()).then(d=>{
      if(d&&d.appUrl){
        urlEl.textContent=d.appUrl;
        urlEl.dataset.url=d.appUrl;
        box.style.display='block';
      }else{
        urlEl.textContent='暂不可用，请稍后重试';
        box.style.display='block';
      }
    }).catch(()=>{urlEl.textContent='加载失败';box.style.display='block';});
  }catch(e){}
}
function copyShareUrl(){
  const el=$('#shareUrl');
  const url=el&&el.dataset.url;
  if(!url)return;
  if(navigator.share){
    navigator.share({title:'MUA 工作台',url:url}).catch(()=>{});
    return;
  }
  try{
    navigator.clipboard.writeText(url).then(()=>toast('链接已复制')).catch(()=>fallbackCopy(url));
  }catch(e){fallbackCopy(url);}
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('链接已复制');}catch(e){toast('复制失败，请手动复制');}
  document.body.removeChild(ta);
}
</script>
